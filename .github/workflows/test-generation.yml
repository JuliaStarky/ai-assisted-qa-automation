name: Test Generation

on:
  schedule:
    # GitHub cron runs in UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: test-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Work the In Progress backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_SITE_URL: ${{ secrets.ATLASSIAN_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: |
            Run Backlog mode from .cursor/rules/qa-orchestration.mdc. This is an unattended CI run: no human is available, so wherever the rules say "stop and ask", stop that ticket and move on.

            Queue: Jira project DS, status "In Progress", without the "tests-generated" label, oldest first. Budget: at most 5 tickets this run.

            Jira access: use the Jira Cloud REST API at $ATLASSIAN_SITE_URL with basic auth $ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN. Never print or commit these values.

            For each ticket, sequentially, on a branch tests/<key> cut from main:
            1. Analyze it with the jira-ticket-to-gherkin skill, including live UI recon, and write features/<key>.feature.
            2. Delegate to the test-writer subagent to write a spec under tests/ (with page objects in pages/ and fixtures in fixtures/) that conforms to .cursor/rules/playwright-conventions.mdc and the pom-conventions, api-cleanup, and a11y-checks skills.
            3. Run npx playwright test. On red, delegate to triage; fix test issues via test-writer; record real app bugs in the PR body instead of filing them.
            4. Commit only tests/, pages/, fixtures/, features/, and playwright.config.ts, push the branch, and open one PR with gh pr create titled "<key>: <ticket summary>" whose body links the Jira ticket, lists the scenarios, and states the run result. Open it as a draft if the run is red.
            5. Comment the PR link on the Jira ticket and add the "tests-generated" label.

            Never merge a PR, close or transition a ticket, file a Jira bug, or edit application source. Finish by printing a table of ticket, PR link, and result (green, red-draft, or skipped with reason).
        run: agent -p --force --trust --output-format text "$PROMPT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
