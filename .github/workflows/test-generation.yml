name: Test Generation

on:
  schedule:
    # GitHub cron runs in UTC
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: test-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Work the backlog or self-heal the suite
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_SITE_URL: ${{ secrets.ATLASSIAN_SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMPT: |
            Run Backlog mode from .cursor/rules/qa-orchestration.mdc. This is an unattended CI run: no human is available, so wherever the rules say "stop and ask", stop that ticket and move on.

            Queue: Jira project DS, status "In Progress", without the "tests-generated" label, oldest first. Budget: at most 5 tickets this run.

            Jira access: use the Jira Cloud REST API at $ATLASSIAN_SITE_URL with basic auth $ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN. Never print or commit these values.

            For each ticket, sequentially, on a branch tests/<key> cut from main:
            1. Analyze it with the jira-ticket-to-gherkin skill, including live UI recon, and write features/<key>.feature.
            2. Delegate to the test-writer subagent to write a spec under tests/ (with page objects in pages/ and fixtures in fixtures/) that conforms to .cursor/rules/playwright-conventions.mdc and the pom-conventions, api-cleanup, and a11y-checks skills.
            3. Run npx playwright test. On red, delegate to triage (Heal on red in qa-orchestration). If triage classifies drift (test issue), apply the self-heal skill (.cursor/skills/self-heal/SKILL.md)—not test-writer: re-discover the control, patch only the drifted locator in pages/, re-run with assertions unchanged (at most 5 heals per ticket; stop that ticket if the same failure repeats twice or a heal cannot go green). After each successful heal, commit the POM fix, push, and open a repair PR with gh pr create per self-heal step 6 (title heal: ...). If triage finds a real app bug, do not heal; record the diagnosis for step 4. For red failures that are not locator drift (e.g. new spec logic), delegate to test-writer within the 3-delegation loop guard.
            4. Commit only tests/, pages/, fixtures/, features/, and playwright.config.ts, push the branch, and open one PR with gh pr create titled "<key>: <ticket summary>" whose body links the Jira ticket, lists the scenarios, states the run result, and links any self-heal repair PRs from step 3. Open it as a draft if the run is still red.
            5. Comment the PR link on the Jira ticket and add the "tests-generated" label.

            If the queue is empty, do not stop. Self-heal is not gated on a Jira ticket. Stay on main and heal the existing suite:
            1. Run npx playwright test.
            2. If green, print that there were no tickets and the suite is green, then stop.
            3. If red, delegate to triage (Heal on red in qa-orchestration). If triage classifies drift (test issue), apply the self-heal skill (.cursor/skills/self-heal/SKILL.md)—not test-writer: re-discover the control, patch only the drifted locator in pages/, re-run with assertions unchanged. At most 5 heals this run; stop if the same failure repeats twice or a heal cannot go green. After each successful heal, cut branch heal/<short-slug> from main, commit only that pages/ locator change, push, and open a repair PR with gh pr create per self-heal step 6 (title heal: ...). If triage finds a real app bug, do not heal and do not file a Jira bug; print the diagnosis. For red failures that are not locator drift, do not patch; print the diagnosis.
            4. Finish by printing a table of failing spec, triage classification, repair PR link (or none), and result (green, healed, or stopped with reason).

            Never merge a PR, close or transition a ticket, file a Jira bug, or edit application source. When the queue was not empty, finish by printing a table of ticket, PR link, and result (green, red-draft, or skipped with reason).
        run: agent -p --force --trust --output-format text "$PROMPT"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  report:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write reliability report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/eval-report.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 14

      - name: Commit reliability report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Update the suite reliability report."
          git push
